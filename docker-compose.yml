version: '3.8'

services:
  server:
    build:
      context: ./src/server
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - bingo-data:/app/data
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/bingo.db
      - PORT=3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  bingo-data:
    driver: local
